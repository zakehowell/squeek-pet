[package]
name = "squeek-pet"
version = "0.1.2"
description = "A desktop hamster that moves with Squeektoshi's real wheel"
authors = ["Squeek Pet contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "squeek_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
