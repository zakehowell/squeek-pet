# Builds Squeek Pet on a real Windows machine for every change, runs the tests,
# installs the result, starts the pet and keeps a screenshot of the desktop.
# Nothing is published from here; see release.yml for that.
name: Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, install and start on Windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version

      - run: npm ci
      - run: npm test

      - name: Build the app and both installers
        run: npm run desktop:build

      - name: List the installers
        shell: pwsh
        run: |
          $files = Get-ChildItem src-tauri\target\release\bundle\msi\*.msi, src-tauri\target\release\bundle\nsis\*-setup.exe
          if ($files.Count -ne 2) { throw "expected one .msi and one -setup.exe, found $($files.Count)" }
          $files | ForEach-Object { "{0}  {1:N1} MB  {2}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), ($_.Length / 1MB), $_.Name }

      - name: Install with the setup program, start the pet, take a screenshot
        shell: pwsh
        run: |
          $setup = Get-ChildItem src-tauri\target\release\bundle\nsis\*-setup.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait
          $dirs = @("$env:LOCALAPPDATA\Squeek Pet", "$env:LOCALAPPDATA\Programs\Squeek Pet", "$env:ProgramFiles\Squeek Pet")
          $exe = Get-ChildItem $dirs -Filter *.exe -ErrorAction SilentlyContinue | Where-Object { $_.Name -notmatch "^uninstall" } | Select-Object -First 1
          if (-not $exe) { throw "the setup program did not install Squeek Pet in any of: $($dirs -join ', ')" }
          "Installed: $($exe.FullName)"
          $pet = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 30
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $screen = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $shot = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
          $g = [System.Drawing.Graphics]::FromImage($shot)
          $g.CopyFromScreen($screen.Left, $screen.Top, 0, 0, $shot.Size)
          $shot.Save("$PWD\windows-desktop.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $g.Dispose(); $shot.Dispose()
          "Screen: $($screen.Width)x$($screen.Height)"
          if ($pet.HasExited) { throw "Squeek Pet quit on its own (exit code $($pet.ExitCode))" }
          Stop-Process -Id $pet.Id

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: squeek-pet-windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-desktop-screenshot
          path: windows-desktop.png
          if-no-files-found: ignore
          retention-days: 14
