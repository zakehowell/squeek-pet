# Builds Squeek Pet on a real Windows machine for every change, runs the tests,
# installs the result, starts the pet and keeps a screenshot of the desktop.
# Nothing is published from here; see release.yml for that.
name: Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, install and start on Windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version

      - run: npm ci
      - run: npm test

      - name: Build the app and both installers
        run: npm run desktop:build

      - name: List the installers
        shell: pwsh
        run: |
          $files = Get-ChildItem src-tauri\target\release\bundle\msi\*.msi, src-tauri\target\release\bundle\nsis\*-setup.exe
          if ($files.Count -ne 2) { throw "expected one .msi and one -setup.exe, found $($files.Count)" }
          $files | ForEach-Object { "{0}  {1:N1} MB  {2}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), ($_.Length / 1MB), $_.Name }

      - name: Install with the setup program, start the pet, open settings, take screenshots
        shell: pwsh
        run: |
          $setup = Get-ChildItem src-tauri\target\release\bundle\nsis\*-setup.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait
          $dirs = @("$env:LOCALAPPDATA\Squeek Pet", "$env:LOCALAPPDATA\Programs\Squeek Pet", "$env:ProgramFiles\Squeek Pet")
          $exe = Get-ChildItem $dirs -Filter *.exe -ErrorAction SilentlyContinue | Where-Object { $_.Name -notmatch "^uninstall" } | Select-Object -First 1
          if (-not $exe) { throw "the setup program did not install Squeek Pet in any of: $($dirs -join ', ')" }
          "Installed: $($exe.FullName)"
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Save-Screenshot($name) {
            $screen = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $shot = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
            $g = [System.Drawing.Graphics]::FromImage($shot)
            $g.CopyFromScreen($screen.Left, $screen.Top, 0, 0, $shot.Size)
            $shot.Save("$PWD\$name", [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $shot.Dispose()
            "Saved $name ($($screen.Width)x$($screen.Height))"
          }
          # Opens WebView2's DevTools port so the settings check can drive the pet
          # page. The runner is elevated, and WebView2 ignores the
          # WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS variable and per-user policies
          # for elevated apps, so this uses the machine-wide policy.
          $policy = "HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments"
          New-Item -Path $policy -Force | Out-Null
          New-ItemProperty -Path $policy -Name $exe.Name -Value "--remote-debugging-port=9222" -PropertyType String -Force | Out-Null
          $pet = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 30
          Save-Screenshot "windows-desktop.png"
          if ($pet.HasExited) { throw "Squeek Pet quit on its own (exit code $($pet.ExitCode))" }
          node .github/scripts/check-settings-window.mjs
          $settingsOk = $LASTEXITCODE -eq 0
          Start-Sleep -Seconds 2
          Save-Screenshot "windows-settings.png"
          Stop-Process -Id $pet.Id -ErrorAction SilentlyContinue
          Remove-ItemProperty -Path $policy -Name $exe.Name
          if (-not $settingsOk) { throw "the settings window check failed; see windows-settings.png" }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: squeek-pet-windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-desktop-screenshot
          path: |
            windows-desktop.png
            windows-settings.png
          if-no-files-found: ignore
          retention-days: 14
